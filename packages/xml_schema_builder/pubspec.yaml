name: xml_schema_builder
description: >-
  Build-runner code generator that produces typed Dart classes from XSD schemas.
  Uses the @FromSchema annotation to drive generation via xml_schema_validator.
version: 1.0.0
repository: https://github.com/Hinten/nfe_dart
homepage: https://github.com/Hinten/nfe_dart/tree/main/packages/xml_schema_builder
issue_tracker: https://github.com/Hinten/nfe_dart/issues

environment:
  sdk: ^3.9.2

dependencies:
  xml: ^6.3.0
  json_annotation: ^4.5.0
  analyzer: ^4.1.0
  build: ^2.3.0
  source_gen: ^1.2.2
  glob: ^2.0.2
  xml_schema_validator: ^1.0.0

dev_dependencies:
  lints: ^2.0.0
  test: ^1.16.0
  build_test: ^2.1.0
  json_serializable: ^6.1.4
