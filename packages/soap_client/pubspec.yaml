name: soap_client
description: >-
  Lightweight SOAP/mTLS client for pure Dart and Flutter apps. Supports
  automatic WSDL operation discovery, certificate pinning, and retry logic.
version: 1.0.0
repository: https://github.com/Hinten/nfe_dart
homepage: https://github.com/Hinten/nfe_dart/tree/main/packages/soap_client
issue_tracker: https://github.com/Hinten/nfe_dart/issues

environment:
  sdk: ^3.9.2

dependencies:
  xml: ^6.3.0
  path: ^1.8.0
  http: ^1.1.0


dev_dependencies:
  lints: ^2.0.0
  test: ^1.16.0
  json_serializable: ^6.1.4
  build_runner: 2.4.13
